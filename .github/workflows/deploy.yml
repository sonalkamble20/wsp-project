name: Build and Validate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Root Dependencies
      run: npm install

    - name: Install Client Dependencies
      run: npm install --prefix client

    - name: Build Frontend
      run: npm run build
      env:
        NODE_ENV: production

    - name: Validate Dockerfile
      run: docker build -t fittrak-local .
